<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chile — B&M Agencia Marítima</title>
    <link rel="icon" type="image/png" href="LOGO_bandera.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1f3a 0%, #1a3a5c 55%, #1e4d7a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 15% 25%, rgba(37,99,168,0.25) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 85% 75%, rgba(200,168,75,0.10) 0%, transparent 70%);
            pointer-events: none;
        }

        .pagina {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
        }

        /* Logo */
        .logo-wrap a img {
            height: 68px;
            width: auto;
            display: block;
            filter: brightness(0) invert(1) drop-shadow(0 4px 14px rgba(0,0,0,0.35));
        }

        .logo-pais {
            text-align: center;
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            margin-top: 12px;
        }

        .logo-tagline {
            text-align: center;
            color: rgba(255,255,255,0.75);
            font-size: 0.88rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Ilustración */
        .ilustracion {
            width: 100%;
            max-width: 480px;
        }

        /* Botón volver */
        .btn-volver {
            display: inline-block;
            padding: 13px 36px;
            background: rgba(37,99,168,0.28);
            color: #ffffff;
            border: 1.5px solid rgba(255,255,255,0.32);
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.04em;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.25s, transform 0.25s, box-shadow 0.25s;
        }
        .btn-volver:hover {
            background: rgba(37,99,168,0.52);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.28);
        }

        /* Animaciones SVG */
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-8px); }
        }
        @keyframes girar-engranaje {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes girar-inv {
            from { transform: rotate(0deg); }
            to   { transform: rotate(-360deg); }
        }
        @keyframes parpadeo {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }

        .grupo-barco   { animation: flotar 3.8s ease-in-out infinite; }
        .engranaje-a   { transform-origin: 198px 148px; animation: girar-engranaje 5s linear infinite; }
        .engranaje-b   { transform-origin: 252px 148px; animation: girar-inv 5s linear infinite; }
        .luz-casco     { animation: parpadeo 1.4s ease-in-out infinite; }
    </style>
</head>
<body>
<div class="pagina">

    <!-- Logo -->
    <div class="logo-wrap">
        <a href="index.html">
            <img src="LOGO.png" alt="B&M Agencia Marítima">
        </a>
        <p class="logo-pais">Chile</p>
        <p class="logo-tagline">Página en el Astillero</p>
    </div>

    <!-- Ilustración SVG -->
    <svg class="ilustracion" viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Página en construcción">

        <!-- Mar / agua -->
        <ellipse cx="240" cy="290" rx="210" ry="18" fill="rgba(37,99,168,0.22)"/>

        <!-- Andamios -->
        <!-- Verticales -->
        <rect x="80"  y="100" width="6" height="170" rx="3" fill="#c8a84b" opacity=".55"/>
        <rect x="140" y="80"  width="6" height="190" rx="3" fill="#c8a84b" opacity=".55"/>
        <rect x="336" y="80"  width="6" height="190" rx="3" fill="#c8a84b" opacity=".55"/>
        <rect x="396" y="100" width="6" height="170" rx="3" fill="#c8a84b" opacity=".55"/>
        <!-- Horizontales -->
        <rect x="80"  y="100" width="320" height="5" rx="2.5" fill="#c8a84b" opacity=".45"/>
        <rect x="80"  y="148" width="320" height="5" rx="2.5" fill="#c8a84b" opacity=".45"/>
        <rect x="80"  y="196" width="320" height="5" rx="2.5" fill="#c8a84b" opacity=".45"/>
        <!-- Diagonales -->
        <line x1="80" y1="100" x2="140" y2="148" stroke="#c8a84b" stroke-width="2.5" opacity=".30"/>
        <line x1="140" y1="100" x2="80" y2="148"  stroke="#c8a84b" stroke-width="2.5" opacity=".30"/>
        <line x1="336" y1="100" x2="396" y2="148" stroke="#c8a84b" stroke-width="2.5" opacity=".30"/>
        <line x1="396" y1="100" x2="336" y2="148" stroke="#c8a84b" stroke-width="2.5" opacity=".30"/>

        <!-- Grúa -->
        <rect x="60" y="30" width="8" height="80" rx="4" fill="#c8a84b" opacity=".80"/>
        <rect x="60" y="30" width="130" height="8" rx="4" fill="#c8a84b" opacity=".80"/>
        <line x1="190" y1="38" x2="175" y2="100" stroke="#c8a84b" stroke-width="2" opacity=".60" stroke-dasharray="4 3"/>
        <!-- Gancho -->
        <circle cx="175" cy="104" r="5" fill="none" stroke="#c8a84b" stroke-width="2.5" opacity=".80"/>

        <!-- BARCO (flota suavemente) -->
        <g class="grupo-barco">
            <!-- Casco -->
            <path d="M150 270 L155 220 L330 220 L335 270 Z"
                  fill="#1a3a5c" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
            <!-- Cubierta -->
            <rect x="155" y="210" width="175" height="14" rx="3"
                  fill="#2563a8" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
            <!-- Superestructura -->
            <rect x="190" y="170" width="100" height="42" rx="4"
                  fill="#1e4d7a" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
            <!-- Chimenea -->
            <rect x="225" y="148" width="30" height="26" rx="3"
                  fill="#0a1f3a" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
            <!-- Ventanas superestructura -->
            <rect x="198" y="178" width="18" height="12" rx="2" fill="rgba(200,168,75,0.60)"/>
            <rect x="224" y="178" width="18" height="12" rx="2" fill="rgba(200,168,75,0.60)"/>
            <rect x="250" y="178" width="18" height="12" rx="2" fill="rgba(200,168,75,0.60)"/>
            <!-- Luz casco -->
            <circle class="luz-casco" cx="160" cy="242" r="4"
                    fill="#c8a84b" opacity=".85"/>
            <!-- Ola casco -->
            <path d="M150 270 Q192 260 240 270 Q288 280 335 270"
                  fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
        </g>

        <!-- Engranajes (trabajando) -->
        <g class="engranaje-a">
            <circle cx="198" cy="148" r="18" fill="none" stroke="#c8a84b" stroke-width="4"/>
            <circle cx="198" cy="148" r="7"  fill="#c8a84b" opacity=".55"/>
            <!-- Dientes -->
            <rect x="194" y="126" width="8" height="10" rx="2" fill="#c8a84b"/>
            <rect x="194" y="160" width="8" height="10" rx="2" fill="#c8a84b"/>
            <rect x="176" y="144" width="10" height="8" rx="2" fill="#c8a84b"/>
            <rect x="210" y="144" width="10" height="8" rx="2" fill="#c8a84b"/>
        </g>
        <g class="engranaje-b">
            <circle cx="252" cy="148" r="14" fill="none" stroke="rgba(200,168,75,0.55)" stroke-width="3.5"/>
            <circle cx="252" cy="148" r="5"  fill="rgba(200,168,75,0.45)"/>
            <rect x="249" y="130" width="6" height="8" rx="1.5" fill="rgba(200,168,75,0.75)"/>
            <rect x="249" y="158" width="6" height="8" rx="1.5" fill="rgba(200,168,75,0.75)"/>
            <rect x="234" y="145" width="8" height="6" rx="1.5" fill="rgba(200,168,75,0.75)"/>
            <rect x="258" y="145" width="8" height="6" rx="1.5" fill="rgba(200,168,75,0.75)"/>
        </g>

        <!-- Casco de obra (colgado en andamio) -->
        <path d="M378 112 Q393 102 408 112 L410 122 L376 122 Z"
              fill="#c8a84b" opacity=".85"/>
        <rect x="376" y="120" width="34" height="6" rx="3" fill="#c8a84b" opacity=".65"/>

        <!-- Estrellas / destellos -->
        <circle cx="110" cy="60"  r="2" fill="#c8a84b" opacity=".60"/>
        <circle cx="370" cy="50"  r="1.5" fill="white" opacity=".50"/>
        <circle cx="430" cy="130" r="1.5" fill="#c8a84b" opacity=".45"/>
        <circle cx="55"  cy="200" r="2"   fill="white" opacity=".35"/>

        <!-- Texto integrado en la imagen -->
        <text x="240" y="308"
              font-family="Poppins, sans-serif"
              font-size="11" font-weight="500"
              fill="rgba(255,255,255,0.50)"
              text-anchor="middle"
              letter-spacing="1">
            Chile — B&amp;M Agencia Marítima
        </text>
    </svg>

    <!-- Botón volver -->
    <a href="index.html" class="btn-volver">← Volver al inicio</a>

</div>
</body>
</html>
